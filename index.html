<title>Rabit Tasks</title>

<!--
  DIRECTION CONTRACT

  THESIS: A task manager for exactly two founders that answers "what should I
  work on next" faster than it can be asked — Linear-clean product language,
  built around a scannable backlog and a five-column board, with everything
  else one keystroke away.

  OWN-WORLD: Restrained neutral system (cool greys on #F7F8FA), one blue
  accent (#3B82F6 — Rabit's own), Inter throughout, 1px borders and spacing
  for hierarchy. Elevation exists only on menus, drawers, dragged cards and
  toasts. Status and priority are always shape + word, never colour alone.

  STORY: A founder opens the backlog, sees their day grouped by status with
  overdue and blocked already surfaced, drags one card to In Progress, ⌘K's
  a thought into a task, and closes the tab. Round trip under a minute.

  FORM: Sidebar + topbar shell; Backlog (grouped list, quick-add, inline
  edit, multi-select) as the default view; Board as its twin; My Tasks,
  Inbox triage, Home, and a deliberately reduced Timeline as satellites.
  The task detail is a right drawer that autosaves — never a centre modal.

  FINISH: reviewed against impeccable's craft floor and Operate rules;
  motion follows Emil's frequency framework (⌘K does not animate).
-->

<body>

<div id="root"></div>

<noscript>
  <div style="padding:48px;font-family:system-ui;max-width:480px">
    <h1 style="font-size:20px">Rabit Tasks needs JavaScript.</h1>
    <p style="color:#6B7178">It runs entirely in your browser — there is no server to fall back to.</p>
  </div>
</noscript>

<script>
/* Auto-update. GitHub Pages caches every file for ten minutes, which
   once left a user clicking buttons in a build whose bugs were already
   fixed. On each load: read version.json (never cached); if the build
   changed, refetch every app file straight past the HTTP cache, then
   reload once. Guarded so a bad version.json can never reload-loop. */
(async () => {
  try {
    const res = await fetch('version.json?ts=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const v = await res.json();
    globalThis.__RABIT_BUILD = v.build;
    const seen = localStorage.getItem('rabit.build');
    if (seen === v.build) return;
    if (sessionStorage.getItem('rabit.updating') === v.build) {
      localStorage.setItem('rabit.build', v.build);   // second pass: fresh already
      return;
    }
    sessionStorage.setItem('rabit.updating', v.build);
    await Promise.allSettled((v.files || []).map((f) => fetch(f, { cache: 'reload' })));
    localStorage.setItem('rabit.build', v.build);
    location.reload();
  } catch { /* offline or first load — run what we have */ }
})();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
